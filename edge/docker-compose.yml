version: '3.8'

# Plan B: Greengrass Core に FrameCapture コンポーネントを統合
# RPi 本番: greengrass-core のみ（IP カメラ）/ greengrass-core + mediamtx（USB カメラ）
# Mac 開発: mediamtx + frame-capture（Greengrass 不使用）

services:
  greengrass-core:
    init: true
    build:
      context: ./greengrass
      dockerfile: Dockerfile
    image: noeatstop/greengrass:latest
    container_name: noeatstop-gg-core
    privileged: true
    ports:
      - "8883:8883"
    volumes:
      - /greengrass/v2:/greengrass/v2
      - ~/.aws:/root/.aws:ro
    environment:
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}
      - PROVISION=${PROVISION:-true}
      - THING_NAME=${THING_NAME:-noeatstop-edge-device}
      - THING_GROUP_NAME=${THING_GROUP_NAME:-noeatstop-devices-dev}
      - TES_ROLE_NAME=${TES_ROLE_NAME:-GreengrassV2TokenExchangeRole}
      - TES_ROLE_ALIAS_NAME=${TES_ROLE_ALIAS_NAME:-GreengrassV2TokenExchangeRoleAlias}
      - COMPONENT_DEFAULT_USER=ggc_user:ggc_group
      - THING_POLICY_NAME=${THING_POLICY_NAME:-noeatstop-device-policy-dev}
      - DEPLOY_DEV_TOOLS=true
      # FrameCapture コンポーネント用設定
      - RTSP_URL=${RTSP_URL}
      - VIDEO_BUCKET=${VIDEO_BUCKET}
      - CAPTURE_INTERVAL=${CAPTURE_INTERVAL:-3}
      # ChewingAnalyzer MQTT 送信用
      - IOT_ENDPOINT=${IOT_ENDPOINT:-}
    restart: unless-stopped
    networks:
      - noeatstop-edge

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: noeatstop-mediamtx
    ports:
      - "8554:8554"
    environment:
      - MTX_PROTOCOLS=tcp
    restart: unless-stopped
    networks:
      - noeatstop-edge

  # Mac 開発環境用（Greengrass が動作しない Mac で frame-capture を単体実行）
  frame-capture-dev:
    build: ./frame-capture
    container_name: noeatstop-frame-capture
    profiles:
      - dev
    environment:
      - RTSP_URL=${RTSP_URL}
      - S3_BUCKET=${VIDEO_BUCKET}
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}
      - CAPTURE_INTERVAL=${CAPTURE_INTERVAL:-3}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    depends_on:
      - mediamtx
    restart: unless-stopped
    networks:
      - noeatstop-edge

networks:
  noeatstop-edge:
    driver: bridge
