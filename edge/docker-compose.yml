version: '3.8'

services:
  greengrass-core:
    image: amazon/aws-iot-greengrass:latest
    container_name: noeatstop-gg-core
    privileged: true
    ports:
      - "8883:8883"
    volumes:
      - ./greengrass-v2:/greengrass/v2
      - ./certs:/greengrass/v2/certs
      - ./config:/greengrass/v2/config
      # USB カメラデバイスマウント（ホストに応じて変更）
      # - /dev/video0:/dev/video0
    environment:
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}
      - PROVISION=${PROVISION:-false}
      - THING_NAME=${THING_NAME:-noeatstop-edge-device}
      - THING_GROUP_NAME=${THING_GROUP_NAME:-noeatstop-devices-dev}
    restart: unless-stopped
    networks:
      - noeatstop-edge

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: noeatstop-mediamtx
    ports:
      - "8554:8554"
    environment:
      - MTX_PROTOCOLS=tcp
    restart: unless-stopped
    networks:
      - noeatstop-edge

  frame-capture:
    build: ./frame-capture
    container_name: noeatstop-frame-capture
    environment:
      - RTSP_URL=rtsp://mediamtx:8554/camera
      - S3_BUCKET=${VIDEO_BUCKET}
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}
      - CAPTURE_INTERVAL=${CAPTURE_INTERVAL:-3}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    depends_on:
      - mediamtx
    restart: unless-stopped
    networks:
      - noeatstop-edge

networks:
  noeatstop-edge:
    driver: bridge
